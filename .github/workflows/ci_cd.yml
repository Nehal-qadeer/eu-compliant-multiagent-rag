name: EU Compliant Multi-Agent RAG CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Rigorous QA, Security & RAGAS Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install reportlab

      - name: Execute Full PyTest Suite & RAGAS Benchmarks
        run: |
          pytest -v --cov=src --cov-report=term-missing tests/

      - name: Verify Layman PDF Generation Script
        run: |
          python scripts/generate_architecture_guide_pdf.py

      - name: Validate Dockerfile Build
        run: |
          docker build -t eu-compliant-multiagent-rag:latest .
