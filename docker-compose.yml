version: '3.8'

services:
  # 1. FastAPI Multi-Agent RAG API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eu_multiagent_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - VECTOR_DB_TYPE=qdrant
      - VECTOR_DB_HOST=vector-db
      - VECTOR_DB_PORT=6333
      - SOVEREIGN_LLM_PROVIDER=local_vllm
      - SOVEREIGN_LLM_BASE_URL=http://sovereign-llm:8000/v1
      - AUDIT_LOG_FILE=/app/logs/audit_ledger.jsonl
    volumes:
      - audit_logs:/app/logs
    depends_on:
      vector-db:
        condition: service_healthy
    networks:
      - sovereign_eu_network

  # 2. Sovereign Vector Database (Qdrant)
  vector-db:
    image: qdrant/qdrant:v1.8.2
    container_name: eu_qdrant_vectordb
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sovereign_eu_network

volumes:
  audit_logs:
    driver: local
  qdrant_storage:
    driver: local

networks:
  sovereign_eu_network:
    driver: bridge
